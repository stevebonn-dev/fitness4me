  <script>
    const initialDays = [
      {
        id: 'day_1',
        title: 'Workout Day 1 (Chest & Arms)',
        exercises: [
          {
            id: 'ex_1', name: 'Incline Press', notes: 'Keep elbows slightly tucked', superset: false, cableSides: 'None', cableHeight: 'N/A',
            sets: [{ reps: 10, weight: 20.0, lastReps: 10, lastWeight: 20.0 }, { reps: 8, weight: 25.0, lastReps: 8, lastWeight: 25.0 }]
          },
          {
            id: 'ex_2', name: 'Cable Crossover', notes: 'Squeeze chest at peak contraction', superset: true, cableSides: 'Dual', cableHeight: 'Top',
            sets: [{ reps: 12, weight: 10.0, lastReps: 12, lastWeight: 10.0 }, { reps: 10, weight: 12.5, lastReps: 10, lastWeight: 12.5 }]
          }
        ]
      },
      {
        id: 'day_2',
        title: 'Workout Day 2 (Back & Rear Delts)',
        exercises: [
          {
            id: 'ex_3', name: 'Lat Pull-Downs', notes: 'Full stretch at top', superset: false, cableSides: 'Dual', cableHeight: 'Top',
            sets: [{ reps: 10, weight: 30.0, lastReps: 10, lastWeight: 30.0 }, { reps: 8, weight: 35.0, lastReps: 8, lastWeight: 35.0 }]
          }
        ]
      },
      {
        id: 'day_3',
        title: 'Workout Day 3 (Legs & Abs)',
        exercises: [
          {
            id: 'ex_4', name: 'Leg Press', notes: 'Controlled eccentric tempo', superset: false, cableSides: 'None', cableHeight: 'N/A',
            sets: [{ reps: 10, weight: 80.0, lastReps: 10, lastWeight: 80.0 }, { reps: 8, weight: 100.0, lastReps: 8, lastWeight: 100.0 }]
          }
        ]
      }
    ];

    function initTheme() {
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '☀️ Light';
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '🌙 Dark';
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('theme-icon').innerText = '☀️ Light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('theme-icon').innerText = '🌙 Dark';
      }
    }

    function getWorkoutDays() {
      const stored = localStorage.getItem('workout_days');
      return stored ? JSON.parse(stored) : initialDays;
    }

    function saveWorkoutDays(days) {
      localStorage.setItem('workout_days', JSON.stringify(days));
    }

    let activeDayId = 'day_1';
    let timerInterval = null;
    let timerTimeLeft = 90;

    function startTimer() {
      clearInterval(timerInterval);
      const inputVal = parseInt(document.getElementById('timer-input-seconds').value) || 90;
      if (timerTimeLeft <= 0 || timerTimeLeft === 90) timerTimeLeft = inputVal;

      timerInterval = setInterval(() => {
        timerTimeLeft--;
        updateTimerDisplay();
        if (timerTimeLeft <= 0) {
          clearInterval(timerInterval);
          playAlarmSound();
          alert('Rest period ended!');
          resetTimer();
        }
      }, 1000);
    }

    function pauseTimer() { clearInterval(timerInterval); }

    function resetTimer() {
      clearInterval(timerInterval);
      const inputVal = parseInt(document.getElementById('timer-input-seconds').value) || 90;
      timerTimeLeft = inputVal;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerTimeLeft / 60);
      const secs = timerTimeLeft % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Audio alert error:', e);
      }
    }

    function renderDashboard() {
      const days = getWorkoutDays();
      const container = document.getElementById('workout-days-container');
      
      container.innerHTML = days.map(d => `
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between space-y-4">
          <div>
            <h3 class="font-bold text-lg text-slate-900 dark:text-white mb-1">${d.title}</h3>
            <p class="text-xs text-amber-500 font-semibold">${d.exercises.length} Exercises Configured</p>
            <ul class="text-xs text-slate-500 dark:text-slate-400 mt-3 space-y-1">
              ${d.exercises.slice(0, 3).map(e => `<li>• ${e.name}</li>`).join('')}
              ${d.exercises.length > 3 ? `<li class="text-slate-400 dark:text-slate-500">+ ${d.exercises.length - 3} more...</li>` : ''}
            </ul>
          </div>
          <div class="flex items-center space-x-2 pt-2 border-t border-slate-100 dark:border-slate-700">
            <button onclick="openWorkoutDay('${d.id}')" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-lg transition">
              Open & Track
            </button>
            <button onclick="deleteWorkoutDay('${d.id}')" class="px-2.5 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-bold text-xs rounded-lg hover:bg-red-200">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    function openWorkoutDay(dayId) {
      activeDayId = dayId;
      switchTab('workout');
    }

    function createNewDay() {
      const days = getWorkoutDays();
      const newId = 'day_' + Date.now();
      const newDay = { id: newId, title: `Workout Day ${days.length + 1}`, exercises: [] };
      days.push(newDay);
      saveWorkoutDays(days);
      renderDashboard();
      openWorkoutDay(newId);
    }

    function deleteWorkoutDay(dayId) {
      if (confirm('Delete this workout day routine?')) {
        let days = getWorkoutDays().filter(d => d.id !== dayId);
        saveWorkoutDays(days);
        renderDashboard();
      }
    }

    function renderWorkoutEditor() {
      const days = getWorkoutDays();
      const activeDay = days.find(d => d.id === activeDayId) || days[0];
      if (!activeDay) return;

      document.getElementById('active-day-title').value = activeDay.title;
      const container = document.getElementById('exercises-list');

      if (activeDay.exercises.length === 0) {
        container.innerHTML = `<div class="p-8 text-center bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400">No exercises added yet. Click "+ Add Exercise" above to start building this session.</div>`;
        return;
      }

      container.innerHTML = activeDay.exercises.map((ex, index) => `
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border ${ex.superset ? 'border-amber-500' : 'border-slate-200 dark:border-slate-700'} shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
            <div class="flex items-center space-x-2 flex-grow">
              <span class="text-xs font-bold text-slate-400">#${index + 1}</span>
              <input type="text" value="${ex.name}" onchange="updateExerciseName('${ex.id}', this.value)" class="bg-transparent font-bold text-base text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 border-b border-transparent w-full" />
              ${ex.superset ? '<span class="text-[10px] bg-amber-500 text-slate-900 font-extrabold px-2 py-0.5 rounded uppercase">Superset</span>' : ''}
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="toggleSuperset('${ex.id}')" class="px-2 py-1 text-xs font-semibold rounded border ${ex.superset ? 'bg-amber-500/20 text-amber-500 border-amber-500' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}">
                ${ex.superset ? '✓ Superset' : 'Link Superset'}
              </button>
              <button onclick="moveExercise('${ex.id}', -1)" class="p-1 bg-slate-200 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-700">▲</button>
              <button onclick="moveExercise('${ex.id}', 1)" class="p-1 bg-slate-200 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-700">▼</button>
              <button onclick="removeExercise('${ex.id}')" class="p-1 text-red-500 text-xs hover:underline">Remove</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="flex items-center space-x-2">
              <label class="text-slate-500 dark:text-slate-400">Cable Sides:</label>
              <select onchange="updateCableSetting('${ex.id}', 'cableSides', this.value)" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-900 dark:text-white">
                <option value="None" ${ex.cableSides==='None'?'selected':''}>N/A (Free Weight / Machine)</option>
                <option value="Single" ${ex.cableSides==='Single'?'selected':''}>Single Side</option>
                <option value="Dual" ${ex.cableSides==='Dual'?'selected':''}>Both Sides (Dual)</option>
              </select>
            </div>
            <div class="flex items-center space-x-2">
              <label class="text-slate-500 dark:text-slate-400">Cable Height:</label>
              <select onchange="updateCableSetting('${ex.id}', 'cableHeight', this.value)" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-900 dark:text-white">
                <option value="N/A" ${ex.cableHeight==='N/A'?'selected':''}>N/A</option>
                <option value="Top" ${ex.cableHeight==='Top'?'selected':''}>Top Position</option>
                <option value="Upper" ${ex.cableHeight==='Upper'?'selected':''}>Upper Height</option>
                <option value="Middle" ${ex.cableHeight==='Middle'?'selected':''}>Middle Height</option>
                <option value="Lower" ${ex.cableHeight==='Lower'?'selected':''}>Lower Height</option>
                <option value="Bottom" ${ex.cableHeight==='Bottom'?'selected':''}>Bottom Position</option>
              </select>
            </div>
          </div>

          <div class="space-y-2">
            <div class="grid grid-cols-12 text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase px-2">
              <span class="col-span-2">Set</span>
              <span class="col-span-4">Last Logged</span>
              <span class="col-span-3">Reps</span>
              <span class="col-span-3">Weight (kg)</span>
            </div>

            ${ex.sets.map((s, sIndex) => `
              <div class="grid grid-cols-12 items-center gap-2 bg-slate-50 dark:bg-slate-900 p-2 rounded-lg border border-slate-200 dark:border-slate-700">
                <span class="col-span-2 font-bold text-xs text-amber-500">Set ${sIndex + 1}</span>
                <span class="col-span-4 text-xs text-slate-500 dark:text-slate-400 font-mono">${s.lastReps || '--'} reps × ${s.lastWeight || '--'} kg</span>
                <input type="number" value="${s.reps}" onchange="updateSetVal('${ex.id}', ${sIndex}, 'reps', this.value)" class="col-span-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded p-1.5 text-xs text-center font-bold text-slate-900 dark:text-white" />
                <div class="col-span-3 flex items-center space-x-1">
                  <input type="number" step="0.5" value="${s.weight}" onchange="updateSetVal('${ex.id}', ${sIndex}, 'weight', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded p-1.5 text-xs text-center font-bold text-slate-900 dark:text-white" />
                  <button onclick="removeSet('${ex.id}', ${sIndex})" class="text-xs text-red-500 px-1">✕</button>
                </div>
              </div>
            `).join('')}

            <button onclick="addSet('${ex.id}')" class="w-full py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-xs font-semibold rounded-lg text-slate-700 dark:text-slate-300">
              + Add Set
            </button>
          </div>

          <div>
            <textarea placeholder="Exercise notes..." onchange="updateExerciseNotes('${ex.id}', this.value)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded p-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-amber-500" rows="2">${ex.notes || ''}</textarea>
          </div>
        </div>
      `).join('');
    }

    function updateDayTitle(val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) { day.title = val; saveWorkoutDays(days); renderDashboard(); }
    }

    function addExerciseToActiveDay() {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) {
        day.exercises.push({
          id: 'ex_' + Date.now(),
          name: 'New Exercise',
          notes: '',
          superset: false,
          cableSides: 'None',
          cableHeight: 'N/A',
          sets: [{ reps: 10, weight: 10, lastReps: 10, lastWeight: 10 }]
        });
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function removeExercise(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) {
        day.exercises = day.exercises.filter(e => e.id !== exId);
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function moveExercise(exId, dir) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (!day) return;
      const idx = day.exercises.findIndex(e => e.id === exId);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx >= 0 && targetIdx < day.exercises.length) {
        const temp = day.exercises[idx];
        day.exercises[idx] = day.exercises[targetIdx];
        day.exercises[targetIdx] = temp;
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function toggleSuperset(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.superset = !ex.superset; saveWorkoutDays(days); renderWorkoutEditor(); }
    }

    function updateCableSetting(exId, key, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex[key] = val; saveWorkoutDays(days); }
    }

    function updateExerciseNotes(exId, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.notes = val; saveWorkoutDays(days); }
    }

    function updateExerciseName(exId, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.name = val; saveWorkoutDays(days); }
    }

    function addSet(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) {
        const lastSet = ex.sets[ex.sets.length - 1] || { reps: 10, weight: 10 };
        ex.sets.push({ reps: lastSet.reps, weight: lastSet.weight, lastReps: lastSet.reps, lastWeight: lastSet.weight });
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function removeSet(exId, sIndex) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex && ex.sets.length > 1) {
        ex.sets.splice(sIndex, 1);
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function updateSetVal(exId, sIndex, key, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex && ex.sets[sIndex]) {
        ex.sets[sIndex][key] = parseFloat(val) || 0;
        saveWorkoutDays(days);
      }
    }

    function finishAndSaveWorkout() {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (!day) return;

      day.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          s.lastReps = s.reps;
          s.lastWeight = s.weight;
        });
      });
      saveWorkoutDays(days);

      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      history.unshift({
        title: day.title,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        exercises: JSON.parse(JSON.stringify(day.exercises))
      });
      localStorage.setItem('workout_history', JSON.stringify(history));

      renderHistory();
      renderWorkoutEditor();
      alert('Workout recorded!');
      if (window.gapi && gapi.client && gapi.client.getToken()) syncWithDrive();
    }

    let creatineIntake = localStorage.getItem('creatineIntake') || '0g';

    function updateCreatineUI() {
      const btn = document.getElementById('creatine-btn');
      btn.innerText = `Logged: ${creatineIntake}`;
      if (creatineIntake !== '0g') {
        btn.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-300');
        btn.classList.add('bg-amber-500', 'text-slate-900');
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-900');
        btn.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-300');
      }
    }

    function toggleCreatine() {
      if (creatineIntake === '0g') creatineIntake = '3g';
      else if (creatineIntake === '3g') creatineIntake = '5g';
      else creatineIntake = '0g';

      localStorage.setItem('creatineIntake', creatineIntake);
      updateCreatineUI();
      if (window.gapi && gapi.client && gapi.client.getToken()) syncWithDrive();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      const container = document.getElementById('history-list');

      if (history.length === 0) {
        container.innerHTML = `<div class="p-6 text-center bg-white dark:bg-slate-800 rounded-xl text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">No workout logs stored yet.</div>`;
        return;
      }

      container.innerHTML = history.map(h => `
        <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 shadow-sm">
          <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
            <h3 class="font-bold text-amber-500">${h.title}</h3>
            <span class="text-xs text-slate-400">${h.date}</span>
          </div>
          <div class="text-xs space-y-1 text-slate-600 dark:text-slate-300">
            ${h.exercises.map(e => `
              <div class="flex justify-between">
                <span>• ${e.name}</span>
                <span class="font-mono text-slate-400">${e.sets.map(s => `${s.reps}x${s.weight}kg`).join(', ')}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm('Clear all recorded history?')) {
        localStorage.removeItem('workout_history');
        renderHistory();
      }
    }

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    function openSettingsModal() {
      document.getElementById('setting-client-id').value = localStorage.getItem('google_client_id') || '';
      document.getElementById('setting-api-key').value = localStorage.getItem('google_api_key') || '';
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveSettings() {
      const clientId = document.getElementById('setting-client-id').value.trim();
      const apiKey = document.getElementById('setting-api-key').value.trim();
      localStorage.setItem('google_client_id', clientId);
      localStorage.setItem('google_api_key', apiKey);
      closeSettingsModal();
      initGoogleAuth();
    }

    function gapiLoaded() { gapiInited = true; initGoogleAuth(); }
    function gisLoaded() { gisInited = true; initGoogleAuth(); }

    function initGoogleAuth() {
      const clientId = localStorage.getItem('google_client_id');
      const apiKey = localStorage.getItem('google_api_key');

      if (!clientId || !apiKey || !gapiInited || !gisInited) return;

      try {
        gapi.client.init({
          apiKey: apiKey,
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        }).then(() => {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/drive.appdata',
            callback: '',
          });
          document.getElementById('sync_button').classList.remove('hidden');
        });
      } catch(err) {
        console.error('Google Auth Init Error:', err);
      }
    }

    async function syncWithDrive() {
      if (!tokenClient) { openSettingsModal(); return; }

      tokenClient.callback = async (resp) => {
        if (resp.error) return;
        const payload = {
          workoutDays: getWorkoutDays(),
          history: JSON.parse(localStorage.getItem('workout_history') || '[]'),
          creatineIntake: localStorage.getItem('creatineIntake') || '0g'
        };

        const file = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const metadata = { name: 'heavydutysteve_v3.json', parents: ['appDataFolder'] };
        const accessToken = gapi.client.getToken().access_token;

        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
          body: form
        });

        if (res.ok) alert('Successfully synced with Google Drive!');
      };

      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    function switchTab(targetTab) {
      const navButtons = document.querySelectorAll('.nav-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      navButtons.forEach(btn => {
        if (btn.getAttribute('data-tab') === targetTab) {
          btn.classList.add('bg-amber-500', 'text-slate-900');
          btn.classList.remove('text-slate-600', 'dark:text-slate-400');
        } else {
          btn.classList.remove('bg-amber-500', 'text-slate-900');
          btn.classList.add('text-slate-600', 'dark:text-slate-400');
        }
      });

      tabContents.forEach(content => {
        if (content.id === targetTab) {
          content.classList.add('active');
        } else {
          content.classList.remove('active');
        }
      });

      if (targetTab === 'dashboard') renderDashboard();
      if (targetTab === 'workout') renderWorkoutEditor();
      if (targetTab === 'history') renderHistory();
    }

    document.querySelectorAll('.nav-btn').forEach(button => {
      button.addEventListener('click', () => {
        const targetTab = button.getAttribute('data-tab');
        switchTab(targetTab);
      });
    });

    initTheme();
    updateCreatineUI();
    renderDashboard();
    renderHistory();
    updateTimerDisplay();
  </script>
