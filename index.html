<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fitness4Me - High-Intensity Heavy Duty Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-scale: 1;
    }

    body.font-large { --font-scale: 1.15; }
    body.font-xlarge { --font-scale: 1.3; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: calc(15px * var(--font-scale));
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Header & Navigation */
    header {
      background-color: #090d16;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
    }
    .header-title { font-size: calc(18px * var(--font-scale)); font-weight: 700; color: #fff; text-align: center; margin-bottom: 8px; }
    
    nav { display: flex; justify-content: space-around; gap: 8px; }
    .nav-btn {
      flex: 1;
      padding: 8px 12px;
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-weight: 600;
      font-size: calc(13px * var(--font-scale));
      cursor: pointer;
      text-align: center;
    }
    .nav-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* Container */
    .container { padding: 16px; max-width: 768px; margin: 0 auto; }
    
    /* Metrics Banner */
    .rest-banner {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rest-banner-title { font-size: calc(13px * var(--font-scale)); color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .rest-banner-value { font-size: calc(22px * var(--font-scale)); font-weight: 800; color: var(--accent); }

    /* Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .card-title { font-size: calc(16px * var(--font-scale)); font-weight: 700; color: #ffffff; }

    /* Controls & Dropdowns */
    label { display: block; font-size: calc(12px * var(--font-scale)); color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    select, input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #ffffff;
      font-size: calc(14px * var(--font-scale));
      margin-bottom: 10px;
    }
    select:focus, input:focus { outline: none; border-color: var(--accent); }

    /* Exercise Items */
    .exercise-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .exercise-title { font-weight: 700; color: #ffffff; font-size: calc(15px * var(--font-scale)); }
    
    .reorder-btns { display: flex; gap: 4px; }
    .btn-mini {
      padding: 4px 8px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger-mini {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .exercise-settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    /* Sets Table */
    .sets-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .sets-table th { font-size: calc(11px * var(--font-scale)); color: var(--text-muted); text-align: center; padding: 4px; }
    .sets-table td { padding: 4px; text-align: center; vertical-align: middle; }
    
    .last-target-badge {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      font-size: calc(11px * var(--font-scale));
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* Checkbox styling */
    .checkbox-custom {
      width: 20px;
      height: 20px;
      accent-color: var(--success);
      cursor: pointer;
    }

    /* Primary Action Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: calc(14px * var(--font-scale));
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-success { background: var(--success); color: #0f172a; }
    .btn-warning { background: var(--warning); color: #0f172a; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Hidden File Picker */
    #jsonFileInput { display: none; }

    /* Tab Displays */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* History Items */
    .history-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .history-date { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .history-meta { font-size: calc(12px * var(--font-scale)); color: var(--text-muted); margin-bottom: 8px; }
    .history-exercise { font-size: calc(13px * var(--font-scale)); border-top: 1px solid #1e293b; padding-top: 4px; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Fitness4Me Heavy Duty</div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('workout')">Workouts</button>
      <button class="nav-btn" onclick="switchTab('history')">History</button>
      <button class="nav-btn" onclick="switchTab('settings')">Settings</button>
    </nav>
  </header>

  <div class="container">

    <!-- REST DAYS BANNER -->
    <div class="rest-banner">
      <div>
        <div class="rest-banner-title">Rest Days Since Last Workout</div>
        <div style="font-size: 12px; color: var(--text-muted);" id="lastWorkoutDateText">Last session: Never</div>
      </div>
      <div class="rest-banner-value" id="restDaysCount">0 Days</div>
    </div>

    <!-- WORKOUT TAB -->
    <div id="tab-workout" class="tab-content active">
      <div class="card">
        <label for="workoutDaySelect">Select Workout Routine</label>
        <select id="workoutDaySelect" onchange="renderActiveWorkout()"></select>
        
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="btn btn-secondary" style="flex:1; margin-bottom:0;" onclick="promptAddExercise()">+ Add Exercise</button>
          <button class="btn btn-danger-mini" style="flex:1; margin-bottom:0; border-radius:8px; font-weight:700;" onclick="promptDeleteWorkout()">🗑️ Delete Routine</button>
        </div>
      </div>

      <div id="activeWorkoutContainer"></div>

      <button class="btn btn-success" onclick="completeWorkout()">
        ✓ Complete Workout & Sync to Cloud
      </button>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab-content">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Completed Workout Logs</div>
        </div>
        <div id="historyLogsContainer"></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content">
      
      <!-- Create New Routine -->
      <div class="card">
        <div class="card-title">Create New Workout Routine</div>
        <label for="newWorkoutTitle">Routine Name</label>
        <input type="text" id="newWorkoutTitle" placeholder="e.g., Workout Day 4 (Core & Legs)" />
        <button class="btn btn-primary" onclick="createNewWorkoutRoutine()">Create Routine</button>
      </div>

      <!-- Display & Accessibility -->
      <div class="card">
        <div class="card-title">Display Settings</div>
        <label for="fontSizeSelect">Font Scaling</label>
        <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
          <option value="normal">Normal Text</option>
          <option value="large">Large Text</option>
          <option value="xlarge">Extra Large Text</option>
        </select>
      </div>

      <!-- Manual Backup & File Picker -->
      <div class="card">
        <div class="card-title">Local JSON Backup & Restore</div>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
          Import backup JSON files copied from local storage or Google Drive.
        </p>
        
        <input type="file" id="jsonFileInput" accept=".json,application/json" onchange="handleFileSelect(event)" />
        
        <button class="btn btn-primary" onclick="triggerFilePicker()">
          📁 Select JSON Backup File
        </button>
        <button class="btn btn-secondary" onclick="exportBackupJSON()">
          ⬇️ Download Backup JSON
        </button>
      </div>

      <!-- Google Drive Cloud Setup -->
      <div class="card">
        <div class="card-title">Google Drive Integration</div>
        <label for="gdriveClientId">OAuth Client ID</label>
        <input type="text" id="gdriveClientId" placeholder="Enter Google OAuth Client ID" />

        <label for="gdriveToken">Access Token / API Key</label>
        <input type="password" id="gdriveToken" placeholder="Enter OAuth Access Token" />

        <button class="btn btn-secondary" onclick="saveDriveSettings()">Save Drive Credentials</button>
        <button class="btn btn-warning" onclick="syncToGoogleDrive()">☁️ Manual Cloud Backup Now</button>
      </div>

    </div>

  </div>

  <script>
    let appState = {
      workoutDays: [
        {
          id: "day_1",
          title: "Workout Day 1 (Chest & Arms)",
          exercises: [
            {
              id: "ex_1",
              name: "Cable Incline Press",
              notes: "Bench on 2nd highest setting",
              cableSides: "both",
              cableHeight: 26,
              sets: [
                { reps: 6, weight: 10, completed: false, lastReps: 6, lastWeight: 10 },
                { reps: 8, weight: 8, completed: false, lastReps: 8, lastWeight: 8 }
              ]
            }
          ]
        }
      ],
      history: [],
      driveClientId: "",
      driveToken: "",
      fontSize: "normal"
    };

    window.onload = function() {
      loadLocalStorage();
      renderWorkoutSelect();
      renderActiveWorkout();
      renderHistory();
      calculateRestDays();
      applyFontSize(appState.fontSize);
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      event.target.classList.add('active');
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('fitness4me_workouts');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.workoutDays) appState.workoutDays = parsed.workoutDays;
          if (parsed.history) appState.history = parsed.history;
          if (parsed.driveClientId) appState.driveClientId = parsed.driveClientId;
          if (parsed.driveToken) appState.driveToken = parsed.driveToken;
          if (parsed.fontSize) appState.fontSize = parsed.fontSize;

          document.getElementById('gdriveClientId').value = appState.driveClientId || '';
          document.getElementById('gdriveToken').value = appState.driveToken || '';
          document.getElementById('fontSizeSelect').value = appState.fontSize || 'normal';
        } catch (e) {
          console.error("Error loading localStorage:", e);
        }
      }
    }

    function saveLocalStorage() {
      localStorage.setItem('fitness4me_workouts', JSON.stringify(appState));
    }

    function renderWorkoutSelect() {
      const select = document.getElementById('workoutDaySelect');
      select.innerHTML = appState.workoutDays.map((d, i) => `<option value="${i}">${d.title}</option>`).join('');
    }

    function renderActiveWorkout() {
      const index = document.getElementById('workoutDaySelect').value || 0;
      const day = appState.workoutDays[index];
      const container = document.getElementById('activeWorkoutContainer');

      if (!day) {
        container.innerHTML = `<div class="card">No workouts found. Please create one in Settings.</div>`;
        return;
      }

      let html = '';
      day.exercises.forEach((ex, exIdx) => {
        html += `
          <div class="exercise-item">
            <div class="exercise-header">
              <span class="exercise-title">${ex.name}</span>
              <div class="reorder-btns">
                <button class="btn-mini" onclick="moveExercise(${index}, ${exIdx}, -1)">▲</button>
                <button class="btn-mini" onclick="moveExercise(${index}, ${exIdx}, 1)">▼</button>
                <button class="btn-mini btn-danger-mini" onclick="promptDeleteExercise(${index}, ${exIdx})">🗑️</button>
              </div>
            </div>

            <div class="exercise-settings-grid">
              <div>
                <label>Cable Sides</label>
                <select onchange="updateExSetting(${index}, ${exIdx}, 'cableSides', this.value)">
                  <option value="single" ${ex.cableSides === 'single' ? 'selected' : ''}>single</option>
                  <option value="both" ${ex.cableSides === 'both' ? 'selected' : ''}>both</option>
                </select>
              </div>
              <div>
                <label>Cable Height</label>
                <select onchange="updateExSetting(${index}, ${exIdx}, 'cableHeight', parseInt(this.value))">
                  ${Array.from({length: 31}, (_, i) => i + 1).map(h => `<option value="${h}" ${ex.cableHeight === h ? 'selected' : ''}>${h}</option>`).join('')}
                </select>
              </div>
            </div>

            <table class="sets-table">
              <thead>
                <tr>
                  <th>Set</th>
                  <th>Target (Last)</th>
                  <th>Plates</th>
                  <th>Reps</th>
                  <th>Done</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${ex.sets.map((s, sIdx) => `
                  <tr>
                    <td>#${sIdx + 1}</td>
                    <td><span class="last-target-badge">${s.lastWeight || s.weight}p × ${s.lastReps || s.reps}r</span></td>
                    <td>
                      <select style="width: 65px; margin:0;" onchange="updateSetPlates(${index}, ${exIdx}, ${sIdx}, parseInt(this.value))">
                        ${Array.from({length: 20}, (_, i) => i + 1).map(p => `<option value="${p}" ${s.weight === p ? 'selected' : ''}>${p}</option>`).join('')}
                      </select>
                    </td>
                    <td>
                      <input type="number" value="${s.reps}" style="width: 55px; margin: 0; text-align: center;" onchange="updateSetReps(${index}, ${exIdx}, ${sIdx}, this.value)" />
                    </td>
                    <td>
                      <input type="checkbox" class="checkbox-custom" ${s.completed ? 'checked' : ''} onchange="toggleSetComplete(${index}, ${exIdx}, ${sIdx}, this.checked)" />
                    </td>
                    <td>
                      <button class="btn-mini btn-danger-mini" onclick="promptDeleteSet(${index}, ${exIdx}, ${sIdx})">✕</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <button class="btn btn-secondary" style="margin-top: 10px; padding: 6px; font-size: 13px;" onclick="addSet(${index}, ${exIdx})">+ Add Set</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function moveExercise(dayIdx, exIdx, dir) {
      const ex = appState.workoutDays[dayIdx].exercises;
      const target = exIdx + dir;
      if (target < 0 || target >= ex.length) return;
      const temp = ex[exIdx];
      ex[exIdx] = ex[target];
      ex[target] = temp;
      saveLocalStorage();
      renderActiveWorkout();
    }

    function updateExSetting(dayIdx, exIdx, key, value) {
      appState.workoutDays[dayIdx].exercises[exIdx][key] = value;
      saveLocalStorage();
    }

    function updateSetPlates(dayIdx, exIdx, sIdx, value) {
      appState.workoutDays[dayIdx].exercises[exIdx].sets[sIdx].weight = value;
      saveLocalStorage();
    }

    function updateSetReps(dayIdx, exIdx, sIdx, value) {
      appState.workoutDays[dayIdx].exercises[exIdx].sets[sIdx].reps = parseInt(value) || 0;
      saveLocalStorage();
    }

    function toggleSetComplete(dayIdx, exIdx, sIdx, completed) {
      appState.workoutDays[dayIdx].exercises[exIdx].sets[sIdx].completed = completed;
      saveLocalStorage();
    }

    function addSet(dayIdx, exIdx) {
      const sets = appState.workoutDays[dayIdx].exercises[exIdx].sets;
      const last = sets[sets.length - 1] || { reps: 5, weight: 10, lastReps: 5, lastWeight: 10 };
      sets.push({
        reps: last.reps,
        weight: last.weight,
        completed: false,
        lastReps: last.lastReps || last.reps,
        lastWeight: last.lastWeight || last.weight
      });
      saveLocalStorage();
      renderActiveWorkout();
    }

    function promptDeleteSet(dayIdx, exIdx, sIdx) {
      if (confirm("Are you sure you want to delete this set?")) {
        appState.workoutDays[dayIdx].exercises[exIdx].sets.splice(sIdx, 1);
        saveLocalStorage();
        renderActiveWorkout();
      }
    }

    function promptDeleteExercise(dayIdx, exIdx) {
      const exName = appState.workoutDays[dayIdx].exercises[exIdx].name;
      if (confirm(`Are you sure you want to delete exercise "${exName}"?`)) {
        appState.workoutDays[dayIdx].exercises.splice(exIdx, 1);
        saveLocalStorage();
        renderActiveWorkout();
      }
    }

    function promptAddExercise() {
      const dayIdx = document.getElementById('workoutDaySelect').value || 0;
      const name = prompt("Enter exercise name:");
      if (!name) return;

      appState.workoutDays[dayIdx].exercises.push({
        id: "ex_" + Date.now(),
        name: name,
        notes: "",
        cableSides: "both",
        cableHeight: 1,
        sets: [
          { reps: 8, weight: 10, completed: false, lastReps: 8, lastWeight: 10 }
        ]
      });
      saveLocalStorage();
      renderActiveWorkout();
    }

    function createNewWorkoutRoutine() {
      const titleInput = document.getElementById('newWorkoutTitle');
      const title = titleInput.value.trim();
      if (!title) {
        alert("Please enter a routine name.");
        return;
      }

      appState.workoutDays.push({
        id: "day_" + Date.now(),
        title: title,
        exercises: []
      });
      titleInput.value = "";
      saveLocalStorage();
      renderWorkoutSelect();
      document.getElementById('workoutDaySelect').value = appState.workoutDays.length - 1;
      renderActiveWorkout();
      switchTab('workout');
      alert("New routine created successfully!");
    }

    function promptDeleteWorkout() {
      const dayIdx = document.getElementById('workoutDaySelect').value || 0;
      const day = appState.workoutDays[dayIdx];
      if (appState.workoutDays.length <= 1) {
        alert("You must keep at least one workout routine.");
        return;
      }

      if (confirm(`Are you sure you want to delete routine "${day.title}"?`)) {
        appState.workoutDays.splice(dayIdx, 1);
        saveLocalStorage();
        renderWorkoutSelect();
        renderActiveWorkout();
      }
    }

    function completeWorkout() {
      const dayIdx = document.getElementById('workoutDaySelect').value || 0;
      const day = appState.workoutDays[dayIdx];

      const log = {
        date: new Date().toISOString(),
        title: day.title,
        exercises: day.exercises.map(ex => ({
          name: ex.name,
          cableSides: ex.cableSides,
          cableHeight: ex.cableHeight,
          sets: ex.sets.map(s => ({ reps: s.reps, weight: s.weight }))
        }))
      };

      day.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          s.lastWeight = s.weight;
          s.lastReps = s.reps;
          s.completed = false;
        });
      });

      appState.history.unshift(log);
      saveLocalStorage();
      calculateRestDays();
      renderActiveWorkout();
      renderHistory();

      alert("Workout Completed & Logged!");
      syncToGoogleDrive();
    }

    function calculateRestDays() {
      if (!appState.history || appState.history.length === 0) {
        document.getElementById('restDaysCount').innerText = "0 Days";
        document.getElementById('lastWorkoutDateText').innerText = "Last session: None";
        return;
      }

      const lastDate = new Date(appState.history[0].date);
      const now = new Date();
      const diffDays = Math.floor((now - lastDate) / (1000 * 60 * 60 * 24));

      document.getElementById('restDaysCount').innerText = `${diffDays} Days`;
      document.getElementById('lastWorkoutDateText').innerText = `Last: ${lastDate.toLocaleDateString()}`;
    }

    function renderHistory() {
      const container = document.getElementById('historyLogsContainer');
      if (!appState.history || appState.history.length === 0) {
        container.innerHTML = `<p style="font-size:13px; color:var(--text-muted);">No history recorded yet.</p>`;
        return;
      }

      container.innerHTML = appState.history.map(h => {
        const d = new Date(h.date);
        const elapsed = Math.floor((new Date() - d) / (1000 * 60 * 60 * 24));
        return `
          <div class="history-item">
            <div class="history-date">${h.title} - ${d.toLocaleDateString()}</div>
            <div class="history-meta">${elapsed} days ago</div>
            ${h.exercises.map(e => `
              <div class="history-exercise">
                <strong>${e.name}</strong> (${e.cableSides}, Notch ${e.cableHeight})<br/>
                ${e.sets.map(s => `${s.weight}p × ${s.reps}r`).join(' | ')}
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function triggerFilePicker() {
      const fileInput = document.getElementById('jsonFileInput');
      fileInput.value = '';
      fileInput.click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.workoutDays && Array.isArray(parsed.workoutDays)) {
            appState.workoutDays = parsed.workoutDays;
            if (parsed.history) appState.history = parsed.history;
            saveLocalStorage();
            renderWorkoutSelect();
            renderActiveWorkout();
            renderHistory();
            calculateRestDays();
            alert("Backup JSON successfully restored!");
          } else {
            alert("Invalid JSON schema: Missing workoutDays array.");
          }
        } catch (err) {
          alert("Error reading backup JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `heavyduty_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function saveDriveSettings() {
      appState.driveClientId = document.getElementById('gdriveClientId').value;
      appState.driveToken = document.getElementById('gdriveToken').value;
      saveLocalStorage();
      alert("Google Drive credentials saved!");
    }

    function syncToGoogleDrive() {
      if (!appState.driveToken) return;

      fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=media', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${appState.driveToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(appState)
      })
      .then(res => res.json())
      .then(data => console.log("Google Drive Sync Success:", data))
      .catch(err => console.error("Google Drive Sync Failed:", err));
    }

    function changeFontSize(size) {
      appState.fontSize = size;
      applyFontSize(size);
      saveLocalStorage();
    }

    function applyFontSize(size) {
      document.body.classList.remove('font-large', 'font-xlarge');
      if (size === 'large') document.body.classList.add('font-large');
      if (size === 'xlarge') document.body.classList.add('font-xlarge');
    }
  </script>
</body>
</html>
