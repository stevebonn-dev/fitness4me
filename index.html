<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeavyDutySteve Workout Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: auto; background-color: #f2f2f7; color: #1c1c1e; }
        
        .card { 
            background: #ffffff; 
            padding: 16px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            margin-bottom: 15px; 
            border: 1px solid #e5e5ea;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        
        .set-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 8px; }
        .input-group { display: flex; align-items: center; gap: 6px; }
        select, input { padding: 8px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #c7c7cc; background-color: #fff; }
        
        .btn { background: #007aff; color: white; border: none; padding: 8px 14px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #0056b3; }
        .confirm-btn { background: #34c759; color: white; border: none; padding: 8px 16px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .confirm-btn:hover { background: #28a745; }
        
        .backup-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .backup-btn { background: #8e8e93; width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; }
        .backup-btn:hover { background: #636366; }
        .restore-btn { background: #5856d6; width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; }
        .restore-btn:hover { background: #4745a4; }
        
        .timer-display { font-size: 24px; font-weight: 700; margin-top: 20px; text-align: center; color: #007aff; }
        .status-display { font-size: 13px; text-align: center; color: #8e8e93; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

<!-- PROFILE MANAGEMENT HEADER -->
<div class="card">
    <div class="profile-header">
        <div>
            <label for="profile-select"><strong>Active Profile:</strong></label>
            <select id="profile-select" onchange="switchProfile()">
                <option value="Default">Default</option>
            </select>
        </div>
        <button type="button" class="btn" onclick="addNewProfile()">+ New Profile</button>
    </div>
</div>

<div class="card">
    <h2 style="margin-top: 0;">Workout Entry</h2>

    <div id="sets-container">
        <!-- Set Row 1 -->
        <div class="set-row">
            <span><strong>Set 1</strong></span>
            <div class="input-group">
                <label for="reps-1">Reps:</label>
                <select class="reps-select" id="reps-1"></select>
            </div>
            <div class="input-group">
                <label for="weight-1">Weight:</label>
                <select class="weight-select" id="weight-1"></select>
            </div>
            <button type="button" class="confirm-btn" onclick="confirmSet(1)">✓</button>
        </div>
    </div>

    <div class="timer-display" id="timer">Rest Timer: 00:00</div>
    <div class="status-display" id="sync-status">Status: Active Profile - Default</div>

    <!-- Backup & Restore Actions -->
    <div class="backup-group">
        <button type="button" class="btn backup-btn" onclick="exportDataForICloud()">💾 Backup Data File (Save to Device / iCloud)</button>
        <button type="button" class="btn restore-btn" onclick="triggerImport()">📂 Restore / Import Backup JSON</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="handleFileImport(event)">
    </div>
</div>

<script>
    let activeProfile = "Default";
    let audioCtx = null;
    let timerInterval = null;

    // 1. Profile Management Setup
    function initProfiles() {
        try {
            let profiles = JSON.parse(localStorage.getItem('heavyduty_profiles') || '["Default"]');
            activeProfile = localStorage.getItem('heavyduty_active_profile') || profiles[0];
            renderProfileDropdown(profiles);
        } catch (e) {
            console.warn("Storage restricted or unavailable, falling back to Default profile:", e);
            renderProfileDropdown(["Default"]);
        }
    }

    function renderProfileDropdown(profiles) {
        const select = document.getElementById('profile-select');
        if (!select) return;
        
        select.innerHTML = '';
        profiles.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            if (name === activeProfile) opt.selected = true;
            select.appendChild(opt);
        });
        
        const statusEl = document.getElementById('sync-status');
        if (statusEl) statusEl.textContent = `Status: Active Profile - ${activeProfile}`;
    }

    function addNewProfile() {
        const name = prompt("Enter new user profile name:");
        if (!name || name.trim() === "") return;

        const cleanName = name.trim();
        let profiles = ["Default"];

        try {
            profiles = JSON.parse(localStorage.getItem('heavyduty_profiles') || '["Default"]');
            if (!profiles.includes(cleanName)) {
                profiles.push(cleanName);
                localStorage.setItem('heavyduty_profiles', JSON.stringify(profiles));
            }
            activeProfile = cleanName;
            localStorage.setItem('heavyduty_active_profile', activeProfile);
        } catch (e) {
            console.error("Failed to save new profile to storage:", e);
            activeProfile = cleanName;
        }

        renderProfileDropdown(profiles);
        syncToCloud();
    }

    function switchProfile() {
        const select = document.getElementById('profile-select');
        if (!select) return;
        activeProfile = select.value;
        try {
            localStorage.setItem('heavyduty_active_profile', activeProfile);
        } catch (e) {
            console.warn("Could not persist active profile choice:", e);
        }
        document.getElementById('sync-status').textContent = `Status: Switched to ${activeProfile}`;
        syncToCloud();
    }

    // 2. Dropdown Population (Reps 1–35, Weight 0–300)
    function populateDropdowns() {
        const repsSelect = document.getElementById('reps-1');
        const weightSelect = document.getElementById('weight-1');

        if (repsSelect && repsSelect.options.length === 0) {
            for (let i = 1; i <= 35; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                repsSelect.appendChild(opt);
            }
        }

        if (weightSelect && weightSelect.options.length === 0) {
            for (let i = 0; i <= 300; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                weightSelect.appendChild(opt);
            }
        }
    }

    // 3. Audio Context & Timer Logic
    function getAudioContext() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
                audioCtx = new AudioContextClass();
            }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function playBeep() {
        const ctx = getAudioContext();
        if (!ctx) return;

        try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 Tone
            gain.gain.setValueAtTime(0.2, ctx.currentTime);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        } catch (e) {
            console.error("Audio playback error:", e);
        }
    }

    function startTimer(durationInSeconds) {
        clearInterval(timerInterval);
        let remaining = durationInSeconds;
        const timerDisplay = document.getElementById('timer');

        // Prime AudioContext during the user gesture (tick button click)
        getAudioContext();

        function updateDisplay() {
            const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
            const secs = String(remaining % 60).padStart(2, '0');
            timerDisplay.textContent = `Rest Timer: ${mins}:${secs}`;
        }

        updateDisplay();

        timerInterval = setInterval(() => {
            remaining--;
            if (remaining >= 0) {
                updateDisplay();
            }
            if (remaining < 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = "Rest Complete!";
                playBeep();
            }
        }, 1000);
    }

    // 4. Data Confirmation & Storage
    function confirmSet(setId) {
        const repsEl = document.getElementById(`reps-${setId}`);
        const weightEl = document.getElementById(`weight-${setId}`);
        if (!repsEl || !weightEl) return;

        const reps = parseInt(repsEl.value, 10);
        const weight = parseInt(weightEl.value, 10);

        const setEntry = {
            profile: activeProfile,
            setId: setId,
            reps: reps,
            weight: weight,
            timestamp: new Date().toISOString()
        };

        saveLocally(setEntry);
        startTimer(90);
        syncToCloud();
    }

    function saveLocally(entry) {
        const storageKey = `workout_cache_${activeProfile}`;
        const pendingKey = `pending_sync_${activeProfile}`;

        try {
            let userLogs = JSON.parse(localStorage.getItem(storageKey) || "[]");
            userLogs.push(entry);

            localStorage.setItem(storageKey, JSON.stringify(userLogs));
            localStorage.setItem(pendingKey, 'true');
        } catch (e) {
            console.error("Local save error:", e);
        }
        
        document.getElementById('sync-status').textContent = `Status: Saved locally (${activeProfile})`;
    }

    async function syncToCloud() {
        const statusEl = document.getElementById('sync-status');
        const pendingKey = `pending_sync_${activeProfile}`;

        if (!navigator.onLine) {
            statusEl.textContent = `Status: Offline (Saved locally for ${activeProfile})`;
            return;
        }

        const needsSync = localStorage.getItem(pendingKey) === 'true';
        if (!needsSync) return;

        try {
            statusEl.textContent = `Status: Syncing ${activeProfile} data to Drive...`;
            const storageKey = `workout_cache_${activeProfile}`;
            const fullData = localStorage.getItem(storageKey);
            
            const fileName = `heavydutysteve_v3_${activeProfile.toLowerCase().replace(/\s+/g, '_')}.json`;

            // Google Drive API upload bridge target:
            // await uploadToGoogleDrive(fileName, fullData);

            localStorage.setItem(pendingKey, 'false');
            statusEl.textContent = `Status: Synced (${fileName})`;
        } catch (error) {
            console.error('Sync error:', error);
            statusEl.textContent = 'Status: Cloud sync failed (Cached locally)';
        }
    }

    // 5. Manual Export / iCloud Sync
    function exportDataForICloud() {
        let profiles = ["Default"];
        try {
            profiles = JSON.parse(localStorage.getItem('heavyduty_profiles') || '["Default"]');
        } catch(e){}

        let fullExport = {
            exportDate: new Date().toISOString(),
            profiles: profiles,
            workoutData: {}
        };

        profiles.forEach(p => {
            try {
                const userLogs = localStorage.getItem(`workout_cache_${p}`);
                fullExport.workoutData[p] = userLogs ? JSON.parse(userLogs) : [];
            } catch(e) {
                fullExport.workoutData[p] = [];
            }
        });

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullExport, null, 2));
        const downloadAnchor = document.createElement('a');
        const filename = `heavydutysteve_backup_${new Date().toISOString().slice(0,10)}.json`;

        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        document.getElementById('sync-status').textContent = 'Status: Backup exported to device/iCloud';
    }

    // 6. Import & Restore
    function triggerImport() {
        const input = document.getElementById('import-file-input');
        if (input) input.click();
    }

    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);

                if (!importedData.profiles || !importedData.workoutData) {
                    alert("Invalid backup file format.");
                    return;
                }

                let currentProfiles = JSON.parse(localStorage.getItem('heavyduty_profiles') || '["Default"]');
                importedData.profiles.forEach(p => {
                    if (!currentProfiles.includes(p)) {
                        currentProfiles.push(p);
                    }
                });
                localStorage.setItem('heavyduty_profiles', JSON.stringify(currentProfiles));

                Object.keys(importedData.workoutData).forEach(p => {
                    const storageKey = `workout_cache_${p}`;
                    const pendingKey = `pending_sync_${p}`;
                    const dataToSave = JSON.stringify(importedData.workoutData[p] || []);
                    
                    localStorage.setItem(storageKey, dataToSave);
                    localStorage.setItem(pendingKey, 'true');
                });

                activeProfile = currentProfiles[0];
                localStorage.setItem('heavyduty_active_profile', activeProfile);
                renderProfileDropdown(currentProfiles);

                document.getElementById('sync-status').textContent = 'Status: Backup restored successfully!';
                alert("Workout data and profiles restored successfully!");

                syncToCloud();

            } catch (err) {
                console.error("Import failed:", err);
                alert("Failed to parse backup JSON file.");
            }
        };

        reader.readAsText(file);
        event.target.value = '';
    }

    // Online/Offline Listeners
    window.addEventListener('online', () => {
        document.getElementById('sync-status').textContent = 'Status: Network restored. Syncing...';
        syncToCloud();
    });

    window.addEventListener('offline', () => {
        document.getElementById('sync-status').textContent = 'Status: Offline mode';
    });

    // App Initialization
    document.addEventListener('DOMContentLoaded', () => {
        initProfiles();
        populateDropdowns();
    });
</script>

</body>
</html>
